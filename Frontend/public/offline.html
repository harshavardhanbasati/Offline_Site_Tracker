<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FieldSync - Offline</title></head>
  <body style="margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7fa;font-family:system-ui;color:#172033">
    <main style="max-width:420px;text-align:center;padding:32px">
      <div style="width:56px;height:56px;margin:auto auto 20px;border-radius:12px;background:#1676b8;color:white;display:grid;place-items:center;font-weight:800">FS</div>

    </main>
  </body>
